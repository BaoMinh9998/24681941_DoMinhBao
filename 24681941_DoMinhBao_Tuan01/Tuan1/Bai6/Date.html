<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date!</title>
    <style>
        #container{
            border: 2px solid rgb(87, 87, 251);
            width:200px;
            padding-bottom: 20px;
        }
        input{
            display:block;
            margin-bottom: 15px;
        }
        button{
            display: block;
            margin-top:20px;
            margin-left: 50px;
        }

    </style>
</head>
<body id="container">
    <div>
        <label>Name:</label>
        <input type="text">

        <label>Telephone Number:</label>
        <input type="tel">

        <label>Email:</label>
        <input type="email">

        <label>Favorite Color:</label>
        <input type="color" value="#0000ff">

        <label>Date of Birth:</label>
        <input type="date">

        <button type="submit">Submit</button>
    </div>
</body>
</html>
