<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us!</title>
    <style>
        #container{
            border: 2px solid rgb(87, 87, 251);
            width: 500px;
            padding-bottom: 20px;
        }
        fieldset{
            border: black solid 1px;
        }
        textarea{
            width: 165px;
            height: 50px;
        }
    </style>
</head>
<body id='container'>
    <h1>Contact Us</h1>
    <fieldset>
        <legend>Your message:</legend>            
        <table>
            
            <tr>
                <td>To</td>
                <td><input type="text" value="Example Cafe"> </td>
            </tr>

            <tr>
                <td>Your email</td>
                <td><input type="email" > </td>
            </tr>

              <tr>
                <td>Message </td>
                <td> <textarea ></textarea></td>
            </tr>
             <tr>
                <td>Attach file</td>
                <td><input type="file" > </td>
            </tr>
        </table>
    </fieldset>
    <br>
  <fieldset>
    <legend>How you found us:</legend>
   
        <table>
         
            <tr>
                <td>
                    How did you hear about us 
                </td>
                <td>
                    <select id="platform">
                        <option>
                            Google
                        </option>
                        <option>
                            Youtube
                        </option>
                        <option>
                            Facebook
                        </option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    Newsletter
                </td>
                <td>
                    <input type="checkbox" checked> Ensure this box is checked if you would like to receive email updates
                </td>
            </tr>
            </table>
    </fieldset>
    <div>
    <button type="submit">Send Message</button>
    </div>
</body>
</html>
