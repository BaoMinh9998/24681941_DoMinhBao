<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RegisterForm</title>
    <link rel="stylesheet" href="../Bai6/registerform.css">
</head>

<body>
    <table id='container'>

        <tr>
            <th colspan="6">
                <img src="../Bai6/img/panel.png" alt="Jackson Electronics">
            </th>
        </tr>
        <tr>
            <th colspan="6" class="title">Register Form </th>
        </tr>
        <tr>
            <td colspan="6" class="header">register your Jackson Electonics product here </td>
        </tr>
        <tr>
            <td><label for="Firstname">First name:</label></td>
            <td> <input type="text" id="Firstname"> </td>

            <td><label for="Lastname">Last Name: </label> </td>
            <td> <input type="text" id="Lastname"></td>
            <td colspan="2"></td>
        </tr>
        <tr>
            <td><label for="address1">Address#1: </label> </td>
            <td colspan="5"> <input type="text" id="address1" class="long-input"> </td>
        </tr>
        <tr>
            <td><label for="address2">Address#2: </label> </td>
            <td colspan="5"> <input type="text" name="Address#2" id="address2" class="long-input"> </td>
        </tr>
        <tr>
            <td><label for="City">City: </label></td>
            <td> <input type="text" id="City" class="medium-input"></td>

            <td><label for="State">State:</label> </td>
            <td> <input type="text" id="State" class="small-input"></td>

            <td>
                <label for="zip">Zip:</label>
            </td>

            <td>
                <input type="text" id="zip" class="small-input">
            </td>
        </tr>
        <tr>
            <td><label for="Country">Country: </label> </td>
            <td colspan="5"> <input type="text" id="Country" class="medium-input" value="United States"> </td>
        </tr>

        <tr>
            <td colspan="6">
                <hr>
            </td>
        </tr>
        <tr>
            <td><label for="Product">Product: </label> </td>
            <td colspan="5"> <select id="Product">
                    <option>ScanMaster</option>
                    <option>Printer</option>
                    <option>Scanner</option>
                    </select>
            </td>
        </tr>
        <tr>
            <td><label for="Date-Purchased">Date Purchased: </label> </td>
            <td> <input type="text" id="Date-Purchased" class="medium-input"> </td>
        </tr>
        <tr>
            <td><label for="Serial">Serial#: </label> </td>
            <td> <input type="text" id="Serial" class="medium-input"> </td>
        </tr>
        <tr>
            <td> Used for: </td>
            <td colspan="5"> <input type="radio" name="usedfor" id="home">
                <label for="home">Home</label>

                &nbsp;&nbsp;&nbsp;

                <input type="radio" name="usedfor" id="education">
                <label for="education">Educational Institution</label>
                                <br>

                <input type="radio" name="usedfor" id="business" checked>
                <label for="business">Business</label>

                &nbsp;&nbsp;&nbsp;

                <input type="radio" name="usedfor" id="other">
                <label for="other">Other</label>

                <br>
                 <input type="radio" name="usedfor" id="government">
                <label for="government">Government</label>
            </td>
        </tr>
        <tr>
            <td> <label for="System">System (check all that apply): </label> </td>
            <td colspan="5">
                <input type="checkbox" id="windows">
                <label for="windows">Windows</label>

                &nbsp;&nbsp;&nbsp;

                <input type="checkbox" id="unix">
                <label for="unix">UNIX</label>

                <br>

                <input type="checkbox" id="macintosh">
                <label for="macintosh">Macintosh</label>

                &nbsp;&nbsp;&nbsp;

                <input type="checkbox" id="otherSystem">
                <label for="otherSystem">Other</label>


            </td>
        </tr>
        <tr>
            <td colspan="6">
                <hr>
            </td>
        </tr>
        <tr>
            <td> <label for="comments">Comments?: </label> </td>
            <td colspan="5"> <textarea id="comments"></textarea> </td>
        </tr>
        <tr>
            <td colspan="6" class="buttons">
            <button type="submit">Click to register</button>
            <button type="reset">Click to cancel</button>
            </td>
        </tr>
    </table>
</body>

</html>
